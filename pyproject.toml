[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-aware-decision-routing"
version = "0.2.0"
description = "Budgeted, severity-aware review routing for disaster image classification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.4", "torchvision>=0.19", "transformers>=4.40,<6", "Pillow>=10", "matplotlib>=3.7", "joblib>=1.3"]

[project.scripts]
radr-extract = "radr.extract:main"
radr-experiment = "radr.experiment:main"
radr-report = "radr.report:main"
radr-route = "radr.predict:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["radr*"]
